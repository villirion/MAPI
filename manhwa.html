<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manhwa List</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            color: #3498db; /* Blue color for header */
        }

        #app {
            max-width: 1250px; /* Adjusted max-width for better readability */
            margin: 20px auto;
            background-color: #2c3e50; /* Darker background color */
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #34495e; /* Slightly darker border color */
            padding: 12px;
            text-align: center; /* Center the text in each cell */
        }

        th {
            background-color: #2c3e50; /* Darker background for table headers */
            color: #fff;
        }

        .button-container {
            margin-top: 20px;
            text-align: center;
        }

        button {
            background-color: #2c3e50; /* Blue color for buttons */
            color: #fff;
            border: none;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s; /* Smooth transition on hover */
        }

        button:hover {
            background-color: #2980b9; /* Darker blue on hover */
        }

        .update-button {
            background-color: #27ae60; /* Green color for the Update button */
        }

        .delete-button {
            background-color: #e74c3c; /* Red color for the Delete button */
        }

        /* Updated status colors */
        .status-link-broken {
            background-color: #e74c3c; /* Red for Link Broken status */
        }

        .status-up-to-date {
            background-color: #2ecc71; /* Green for Up to Date status */
        }

        .status-new-chapter {
            background-color: #f39c12; /* Yellow for New Chapter Available status */
        }

        /* Hide the action column by default */
        .hide-action {
            display: none;
        }

        /* Visual indicator for selected tier button */
        .selected-tier {
            background-color: #3498db; /* Blue color for selected tier */
        }
    </style>
</head>

<body>
    <div id="app">
        <h1>Manhwa List</h1>

        <div class="button-container">
            <button onclick="toggleActionColumn()">Toggle Action Column</button>
            <button onclick="addManhwa()">Add Manhwa</button>
            <button onclick="reloadAllManhwa()">Reload Manhwa</button>
        </div>

        <div class="button-container">
            <button id="tier1" onclick="fetchData(1)">TIER 1</button>
            <button id="tier2" onclick="fetchData(2)">TIER 2</button>
            <button id="tier3" onclick="fetchData(3)">TIER 3</button>
        </div>

        <table id="manhwaTable">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Chapter</th>
                    <th>Status</th>
                    <th class="action-column">Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- Table rows will be added here dynamically -->
            </tbody>
        </table>
    </div>

    <script>
        let isActionColumnVisible = false;
        let currentTier = 1;

        async function fetchData(tier) {
            currentTier = tier; // Set the current tier
            const response = await fetch(`http://127.0.0.1:5000/mapi?source=manhwa&tier=${tier}`);
            const data = await response.json();

            // Get the table body
            const tableBody = document.querySelector('#manhwaTable tbody');

            // Clear existing rows
            tableBody.innerHTML = '';

            // Iterate over the data and create table rows with conditional styling
            data.forEach(manhwa => {
                const row = document.createElement('tr');
                // Set the background color based on the status
                row.classList.add(getStatusClass(manhwa.STATUS));
                row.innerHTML = `
                    <td><a href="${manhwa.SITE}" target="_blank">${manhwa.TITLE}</a></td>
                    <td><button onclick="updateChapterMinusManhwa('${manhwa.TITLE}','${manhwa.CHAPTER}','${manhwa.SITE}','${manhwa.TIER}')">-</button>
                    ${manhwa.CHAPTER}
                    <button onclick="updateChapterPlusManhwa('${manhwa.TITLE}','${manhwa.CHAPTER}','${manhwa.SITE}','${manhwa.TIER}')">+</button></td>
                    <td>${manhwa.STATUS}</td>
                    <td class="action-column">
                        <button onclick="updateUrlManhwa('${manhwa.TITLE}','${manhwa.CHAPTER}','${manhwa.TIER}')">Update URL</button>
                        <button onclick="deleteManhwa('${manhwa.TITLE}')">Delete</button>
                        <button onclick="reloadManhwa('${manhwa.TITLE}')">Reload</button>
                        ${getTierButtons(manhwa.TIER, manhwa.TITLE, manhwa.CHAPTER, manhwa.SITE)}
                    </td>
                `;
                tableBody.appendChild(row);
            });

            // Toggle the action column visibility based on the variable
            const actionColumns = document.querySelectorAll('.action-column');
            actionColumns.forEach(column => {
                if (isActionColumnVisible) {
                    column.classList.remove('hide-action');
                } else {
                    column.classList.add('hide-action');
                }
            });

            // Update the visual indicator for the selected tier
            updateSelectedTierButton();
        }

        function getStatusClass(status) {
            switch (status) {
                case 'Link broken':
                    return 'status-link-broken';
                case 'Up to date':
                    return 'status-up-to-date';
                default:
                    return 'status-new-chapter';
            }
        }

        function toggleActionColumn() {
            isActionColumnVisible = !isActionColumnVisible;
            fetchData(currentTier);
        }

        function updateSelectedTierButton() {
            document.querySelectorAll('.button-container button').forEach(button => {
                button.classList.remove('selected-tier');
            });
            document.getElementById(`tier${currentTier}`).classList.add('selected-tier');
        }

        async function deleteManhwa(title) {
            const isConfirmed = confirm(`Are you sure you want to delete '${title}'?`);

            if (isConfirmed) {
                const response = await fetch('http://127.0.0.1:5000/mapi?source=manhwa', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ TITLE: title }),
                });

                if (response.ok) {
                    fetchData(currentTier);
                    console.log(`Successfully deleted '${title}'`);
                } else {
                    console.error('Failed to delete:', response.statusText);
                }
            }
        }

        async function updateUrlManhwa(title, chapter, tier) {
            const newUrl = prompt('Enter the new URL:');

            if (title && newUrl) {
                const response = await fetch('http://127.0.0.1:5000/mapi?source=manhwa', {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        TITLE: title,
                        SITE: newUrl,
                        CHAPTER: parseInt(chapter),
                        TIER: tier,
                    }),
                });

                if (response.ok) {
                    fetchData(currentTier);
                    console.log(`Successfully updated URL for '${title}' to '${newUrl}'`);
                } else {
                    console.error('Failed to update URL:', response.statusText);
                }
            } else {
                alert('Please provide all required information.');
            }
        }

        async function updateTierManhwa(title, chapter, site, tier) {
            const response = await fetch('http://127.0.0.1:5000/mapi?source=manhwa', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    TITLE: title,
                    SITE: site,
                    CHAPTER: parseInt(chapter),
                    TIER: tier,
                }),
            });

            if (response.ok) {
                fetchData(currentTier);
                console.log(`Successfully updated tier for '${title}' to '${tier}'`);
            } else {
                console.error('Failed to update tier:', response.statusText);
            }
        }

        async function updateChapterPlusManhwa(title, chapter, site, tier) {
            const response = await fetch('http://127.0.0.1:5000/mapi?source=manhwa', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    TITLE: title,
                    CHAPTER: parseInt(chapter) + 1,
                    SITE: site,
                    TIER: tier,
                }),
            });

            if (response.ok) {
                fetchData(currentTier);
                console.log(`Successfully updated '${title}'`);
            } else {
                console.error('Failed to update:', response.statusText);
            }
        }

        async function updateChapterMinusManhwa(title, chapter, site, tier) {
            const response = await fetch('http://127.0.0.1:5000/mapi?source=manhwa', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    TITLE: title,
                    CHAPTER: parseInt(chapter) - 1,
                    SITE: site,
                    TIER: tier,
                }),
            });

            if (response.ok) {
                fetchData(currentTier);
                console.log(`Successfully updated '${title}'`);
            } else {
                console.error('Failed to update:', response.statusText);
            }
        }

        async function addManhwa() {
            const title = prompt('Enter the title:');
            const site = prompt('Enter the site:');
            const chapter = prompt('Enter the chapter:');
            const tier = prompt('Enter the tier:');

            if (title && site && chapter && tier) {
                const response = await fetch('http://127.0.0.1:5000/mapi?source=manhwa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        TITLE: title,
                        SITE: site,
                        CHAPTER: parseInt(chapter),
                        TIER: tier,
                    }),
                });

                if (response.ok) {
                    fetchData(currentTier);
                    console.log(`Successfully added new entry - Title: ${title}, Site: ${site}, Chapter: ${chapter}`);
                } else {
                    console.error('Failed to add new entry:', response.statusText);
                }
            } else {
                alert('Please provide all required information.');
            }
        }

        async function reloadAllManhwa() {
            const response = await fetch('http://127.0.0.1:5000/mapi/reload?source=manhwa');
            if (response.ok) {
                fetchData(currentTier);
                console.log(`Successfully reloaded`);
            } else {
                console.error('Failed to reload:', response.statusText);
            }
        }

        async function reloadManhwa(title) {
            const response = await fetch('http://127.0.0.1:5000/mapi/reload?source=manhwa', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ TITLE: title }),
            });
            if (response.ok) {
                fetchData(currentTier);
                console.log(`Successfully reloaded`);
            } else {
                console.error('Failed to reload:', response.statusText);
            }
        }

        function getTierButtons(tier, title, chapter, site) {
            let buttons = '';
            if (tier == 1) {
                buttons = `<button onclick="updateTierManhwa('${title}', '${chapter}', '${site}', 2)">→</button>`;
            } else if (tier == 2) {
                buttons = `
                    <button onclick="updateTierManhwa('${title}', '${chapter}', '${site}', 1)">←</button>
                    <button onclick="updateTierManhwa('${title}', '${chapter}', '${site}', 3)">→</button>`;
            } else if (tier == 3) {
                buttons = `<button onclick="updateTierManhwa('${title}', '${chapter}', '${site}', 2)">←</button>`;
            }
            return buttons;
        }

        fetchData(currentTier); // Default to current tier on initial load
    </script>

</body>
</html>
